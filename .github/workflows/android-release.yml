name: Android Build & Auto-Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versão da release (ex: 1.0.1). Deixe vazio para gerar automaticamente.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute Release Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version_name format (expected X.Y.Z)" >&2
              exit 1
            fi
            VER="$INPUT_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            if [[ ! "$TAG_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag version format (expected vX.Y.Z)" >&2
              exit 1
            fi
            VER="$TAG_VER"
          else
            VER="1.0.${GITHUB_RUN_NUMBER}"
          fi
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "version_name=${VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Stamp versionCode & versionName into app/build.gradle.kts
        shell: bash
        env:
          VER_CODE: ${{ steps.version.outputs.version_code }}
          VER_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${VER_CODE}/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VER_NAME}\"/" app/build.gradle.kts

      - name: Decode Release Keystore (if configured in Secrets)
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "has_release_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK (signed)
        if: steps.keystore.outputs.has_release_key == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew || true
          if [[ -f ./gradlew ]]; then
            ./gradlew :app:assembleRelease
          else
            gradle :app:assembleRelease
          fi
          cp app/build/outputs/apk/release/app-release.apk "ReactStudio-v${{ steps.version.outputs.version_name }}.apk"

      - name: Build Debug APK (fallback when release signing secrets are not set)
        if: steps.keystore.outputs.has_release_key != 'true'
        run: |
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=ReactStudio,O=Studio,C=BR"
          fi
          chmod +x gradlew || true
          if [[ -f ./gradlew ]]; then
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "ReactStudio-v${{ steps.version.outputs.version_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: React Studio ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          files: ReactStudio-v${{ steps.version.outputs.version_name }}.apk
